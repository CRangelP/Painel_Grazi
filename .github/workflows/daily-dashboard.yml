name: Daily Dashboard

on:
  schedule:
    - cron: '0 7 * * *'     # 04:00 BRT
    - cron: '0 14 * * *'    # 11:00 BRT
    - cron: '0 19 * * *'    # 16:00 BRT
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - name: Generate dashboards
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}
        run: npm run build

      - name: Check snapshot freshness
        run: node dist-js/check-freshness.js

      - name: Commit docs/
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(dashboard): daily refresh $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push || {
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            }
          fi

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[alerta] Daily Dashboard falhou';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Workflow:** ${context.workflow}`,
              `**Job:** ${context.job}`,
              `**Run:** ${runUrl}`,
              `**Quando (UTC):** ${new Date().toISOString()}`,
              '',
              'Causas comuns (ver logs):',
              '- `[auth]` — token ClickUp inválido/revogado',
              '- `[throttle/API/timeout]` — AbortError, 429 ou 5xx',
              '- `[discoverSubtaskFilter]` — campo SUBTASK ou opção SIM renomeados',
              '- `[freshness]` — generatedAt nos JSON de docs/ acima de 36h',
            ].join('\n');

            const label = 'alerta';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'B60205',
                description: 'Falha operacional do painel (Actions)',
              });
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Opened issue #${issue.number}`);
            }
