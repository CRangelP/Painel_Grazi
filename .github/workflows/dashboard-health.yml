name: Dashboard Health

# Catches prolonged outages (skipped builds, commit/push skipped, Pages serving old HTML).
# Does not call ClickUp — only checks generatedAt in docs/*-data.json on main.
on:
  schedule:
    - cron: '30 8 * * *'   # 05:30 BRT — after the 04:00 refresh window
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dashboard-health
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Check snapshot freshness (max 36h)
        run: npm run check-freshness

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[alerta] Dashboard Health — snapshot stale';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${runUrl}`,
              `**Quando (UTC):** ${new Date().toISOString()}`,
              '',
              '`generatedAt` em `docs/municipal-data.json` e/ou `docs/estadual-data.json` passou de 36h.',
              'O site em GitHub Pages pode ainda mostrar HTML antigo — confira também o workflow **Daily Dashboard**.',
            ].join('\n');

            const label = 'alerta';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'B60205',
                description: 'Falha operacional do painel (Actions)',
              });
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Opened issue #${issue.number}`);
            }
